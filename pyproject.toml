[project]
name = "sports-api"
version = "0.1.0"
description = "Sports Dashboard API - FastAPI service"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.7.0",
    "requests>=2.32.0",
    "typer[all]>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "freezegun>=1.5.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a5",
    "prek",
]

[project.scripts]
sports-cli = "sports_api.cli.commands:app"

[tool.fastapi]
entrypoint = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sports_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=sports_api --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["sports_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]
ignore = [
    "B008",  # function call in default argument (standard FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/api_football_response_example.py" = ["B018"]

[tool.ty.environment]
python-version = "3.13"
root = ["./src", "."]
