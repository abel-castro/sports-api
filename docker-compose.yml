services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
      POSTGRES_DB: sports_api
    ports:
      - "5432:5432"
    volumes:
      - sports_api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports_api"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sports_api_postgres_data:
