name: Sync sports data

on:
  # Schedule disabled temporarily: European leagues are finished for the season.
  # Re-enable when the new season starts.
  # schedule:
  #   - cron: "0 1 * * *" # daily at 01:00 UTC / 03:00 MESZ
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Import standings
        run: |
          curl -fsS \
            --max-time 300 \
            --retry 2 \
            --retry-delay 30 \
            -X POST https://sports-api.fastapicloud.dev/internal/import/standings \
            -H "X-Import-Token: ${{ secrets.IMPORT_TOKEN }}"

      - name: Import results
        run: |
          curl -fsS \
            --max-time 300 \
            --retry 2 \
            --retry-delay 30 \
            -X POST https://sports-api.fastapicloud.dev/internal/import/results \
            -H "X-Import-Token: ${{ secrets.IMPORT_TOKEN }}"
